version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma_secret_2024
      POSTGRES_DB: sigmacloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend-java
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/sigmacloud
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma_secret_2024
      STORAGE_BASE_PATH: ./storage
    depends_on:
      - db
    volumes:
      - ./backend-java/storage:/app/storage

volumes:
  pgdata:
