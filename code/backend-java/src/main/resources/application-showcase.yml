server:
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:mem:axiomcloud_showcase;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

axiomcloud:
  storage:
    base-path: ./storage-showcase
    datasets-path: ./storage-showcase/datasets
    models-path: ./storage-showcase/models
    reports-path: ./storage-showcase/reports
  cors:
    allowed-origins: http://127.0.0.1:8000
