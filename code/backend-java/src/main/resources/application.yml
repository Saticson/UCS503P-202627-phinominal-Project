server:
  port: 8000

spring:
  application:
    name: sukio-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sigmacloud}
    username: ${POSTGRES_USER:sigma}
    password: ${POSTGRES_PASSWORD:sigma_secret_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

axiomcloud:
  storage:
    base-path: ${STORAGE_BASE_PATH:./storage}
    datasets-path: ${DATASET_STORAGE_PATH:./storage/datasets}
    models-path: ${MODEL_STORAGE_PATH:./storage/models}
    reports-path: ${REPORTS_STORAGE_PATH:./storage/reports}
  ml-engine:
    url: ${ML_ENGINE_URL:http://localhost:8001}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    project-id: ${FIREBASE_PROJECT_ID:}

logging:
  level:
    root: INFO
    com.axiomcloud: INFO
    org.springframework.security: WARN
